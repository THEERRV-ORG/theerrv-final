<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Theerrv Technologies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A1630" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #f3f0e8;
        --paper-soft: rgba(243, 240, 232, 0.58);
        --coral: #ff5a4f;
        --gold-bright: #d9bd85;
        --navy-deep: #070d1e;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ivory);
        background: #04060d;
      }

      /* Mirrors the interior PageHero used by the in-app 404 page. */
      .hero {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        min-height: 100svh;
        padding-block: clamp(6rem, 14vw, 10rem);
        background:
          radial-gradient(42vw 42vw at 8% 2%, rgba(183, 154, 99, 0.16), transparent 68%),
          radial-gradient(34vw 34vw at 96% 108%, rgba(255, 90, 79, 0.14), transparent 68%),
          linear-gradient(180deg, #060a16 0%, #0a1630 100%);
      }

      .inner {
        position: relative;
        z-index: 2;
        width: min(1440px, 100% - clamp(3rem, 10vw, 8rem));
        margin-inline: auto;
        max-width: 900px;
      }

      .eyebrow {
        font-weight: 700;
        font-size: clamp(1.4rem, 2.6vw, 2rem);
        letter-spacing: -0.015em;
        line-height: 1.15;
        color: var(--gold-bright);
      }

      .headline {
        margin-top: 1.5rem;
        font-weight: 800;
        font-size: clamp(2.6rem, 6.5vw, 5rem);
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: var(--ivory);
      }
      .headline .line { display: block; }
      .headline .accent {
        background: linear-gradient(120deg, var(--gold-bright) 10%, var(--coral) 90%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        padding-bottom: 0.12em;
      }

      .lead {
        margin-top: 2rem;
        max-width: 54ch;
        font-size: clamp(1.05rem, 1.8vw, 1.25rem);
        font-weight: 300;
        line-height: 1.6;
        color: var(--paper-soft);
      }

      .home {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2.5rem;
        padding: 1rem 1.95rem;
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--navy-deep);
        background: linear-gradient(135deg, var(--ivory) 0%, var(--gold-bright) 130%);
        border-radius: 999px;
        box-shadow: 0 12px 30px -10px rgba(183, 154, 99, 0.5);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .home:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 36px -8px rgba(183, 154, 99, 0.65);
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="inner">
        <p class="eyebrow">Error 404</p>
        <h1 class="headline">
          <span class="line">Page</span>
          <span class="line accent">Not Found.</span>
        </h1>
        <p class="lead">
          The page you're looking for doesn't exist or may have moved. Let's get
          you back on track.
        </p>
        <a class="home" href="/">Back to Home <span aria-hidden="true">&rarr;</span></a>
      </div>
    </section>
  </body>
</html>
